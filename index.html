<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Youssef El Khoury</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f1117;
      --surface: #1a1d27;
      --border:  #2a2d3a;
      --text:    #e8eaf0;
      --muted:   #8890a4;
      --accent:  #c9a227;
    }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 2rem 1.25rem;
    }

    main {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .name {
      font-size: clamp(1.75rem, 6vw, 2.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .tagline {
      margin-top: 0.75rem;
      font-size: 0.95rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .divider {
      margin: 2rem auto;
      width: 40px;
      height: 2px;
      background: var(--accent);
      border-radius: 2px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 0.875rem;
      padding: 0.875rem 1.25rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      text-decoration: none;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 500;
      transition: border-color 0.15s, background 0.15s;
    }

    .link-card:hover {
      border-color: var(--accent);
      background: #21243200;
    }

    .link-card .icon {
      font-size: 1.25rem;
      flex-shrink: 0;
    }

    .link-card .label { flex: 1; text-align: left; }

    .link-card .arrow {
      color: var(--muted);
      font-size: 0.85rem;
      transition: color 0.15s;
    }

    .link-card:hover .arrow { color: var(--accent); }

    .social {
      margin-top: 2rem;
      display: flex;
      justify-content: center;
      gap: 1.25rem;
    }

    .social a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.82rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      transition: color 0.15s;
    }

    .social a:hover { color: var(--accent); }

    .footer {
      margin-top: 2.5rem;
      font-size: 0.75rem;
      color: #3a3d4a;
    }
  </style>
</head>
<body>
  <main>
    <h1 class="name">Youssef El Khoury</h1>
    <p class="tagline">Exploring and documenting the Lebanese tradition<br>of doing things yourself.</p>

    <div class="divider"></div>

    <nav class="links">
      <a class="link-card" href="https://blog.usfkhoury.com">
        <span class="icon">✍️</span>
        <span class="label">Blog</span>
        <span class="arrow">→</span>
      </a>
      <a class="link-card" href="https://olives.usfkhoury.com">
        <span class="icon">🫒</span>
        <span class="label">Olive Grove Tracker</span>
        <span class="arrow">→</span>
      </a>
    </nav>

    <div class="social">
      <a href="https://github.com/usfkhoury" target="_blank" rel="noopener">GitHub</a>
      <a href="https://www.linkedin.com/in/youssef-el-khoury-124648155" target="_blank" rel="noopener">LinkedIn</a>
      <a href="https://www.instagram.com/usfkhoury" target="_blank" rel="noopener">Instagram</a>
      <a href="https://t.me/usfkhoury" target="_blank" rel="noopener">Telegram</a>
      <a href="mailto:usfkhouryy@gmail.com">Email</a>
    </div>

    <p class="footer">usfkhoury.com</p>
  </main>
</body>
</html>
